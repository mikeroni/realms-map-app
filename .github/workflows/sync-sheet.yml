name: Publish approved Sheet data

# Scheduled publication is disabled unless SHEET_SYNC_ENABLED is explicitly set.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: publish-sheet-data
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.SHEET_SYNC_ENABLED == 'true')
    runs-on: ubuntu-latest
    environment: sheet-publishing
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-sync.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install publishing dependencies
        run: python -m pip install -r requirements-sync.txt
      - name: Authenticate read-only Google identity (no stored Google key)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SHEETS_READER }}
      - name: Fetch and validate approved snapshot
        id: sync
        env:
          SHEET_ID: ${{ vars.REALMS_SHEET_ID }}
        run: python -m tools.sync_sheet --sheet-id "$SHEET_ID"
      - name: Test candidate data before committing
        if: steps.sync.outputs.changed == 'true'
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m unittest discover -s tests -v
          node --test tests/sheets/*.test.cjs
      - name: Commit export only
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'Realms Map Dataset.xlsx' data-release.json
          git commit -m "Update approved Realm data"
          git push origin HEAD:main
      # Render's existing auto-deploy may deploy this commit. No deploy hook is
      # enabled here: verify its settings and avoid triggering duplicate deploys.
